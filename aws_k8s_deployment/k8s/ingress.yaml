# ---------------------------------------------------
# Ingress — Routes HTTP traffic to frontend & backend
# Uses Nginx Ingress Controller installed by Helm
# ---------------------------------------------------
# HOW ROUTING WORKS:
#   http://YOUR_EC2_IP/          -> frontend-service (React app)
#   http://YOUR_EC2_IP/api/      -> backend-service (FastAPI)
# ---------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # ML model can be slow to respond
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Frontend — serves React app
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      # Backend API — FastAPI
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 8000
