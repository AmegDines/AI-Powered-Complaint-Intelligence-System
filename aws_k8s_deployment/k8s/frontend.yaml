# ---------------------------------------------------
# Frontend Deployment
# Runs the React + Nginx static SPA on Kubernetes
# ---------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-frontend
  namespace: default
  labels:
    app: helpdesk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: helpdesk-frontend
    spec:
      containers:
      - name: frontend
        # CHANGE: Replace YOUR_DOCKERHUB with your Docker Hub username
        image: YOUR_DOCKERHUB/helpdesk-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
---
# Frontend Service — ClusterIP (exposed via Ingress below)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  selector:
    app: helpdesk-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
